services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: creanovel-sqlserver
    restart: always
    env_file:
      - .env
    ports:
      - '1433:1433'
    volumes:
      - creanovel_volume:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "pidof sqlservr"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

volumes:
  creanovel_volume: